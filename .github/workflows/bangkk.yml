name: Build Kernel Bangkk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Setup Build Environment & ID
        run: |
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install libarchive-tools
          
          BUILD_ID=$(python3 -c "import random, string; print(''.join(random.choice(string.ascii_uppercase) + random.choice(string.digits) for _ in range(3)))")
          DATE_STR=$(date +'%d.%m.2026')
          
          echo "BUILD_ID=${BUILD_ID}" >> $GITHUB_ENV
          echo "DATE_STR=${DATE_STR}" >> $GITHUB_ENV

      - name: Clone Repo Kernel
        uses: sushikernel/github-repo-action@v3.1
        with:
          depth: 1
          branch: 'resukisu'
          owner: 'MrEliteBall'
          repository: 'android_kernel_motorola_bangkk'

      - name: Clone Repo Build
        uses: sushikernel/github-repo-action@v3.1
        with:
          depth: 1
          branch: 'main'
          owner: 'SushiKernel'
          repository: 'build'

      - name: Prepare Configuration
        working-directory: ./build
        run: |
          CONFIG_ENV=$(cat config.env | grep -w "CONFIG_ENV" | head -n 1 | cut -d "=" -f 2)
          echo "ENABLE_CCACHE=$(cat $CONFIG_ENV | grep -w "ENABLE_CCACHE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV

      - name: Set swap to 24G
        uses: SushiKernel/swap@moe
        with:
          swap-size-gb: 10

      - name: Clone Repo Scripts
        uses: SushiKernel/github-repo-action@v3.1
        with:
          owner: 'SushiKernel'
          branch: 'bangkk'
          repository: 'scripts'

      - name: Move Scripts
        working-directory: ./scripts
        run: |
          chmod +x sushi.sh
          cp sushi.sh build_count.txt ../android_kernel_motorola_bangkk

      - name: Compile Kernel CI
        working-directory: ./android_kernel_motorola_bangkk
        run: |
          ./sushi.sh -v bangkk

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_out
          find android_kernel_motorola_bangkk -maxdepth 2 -type f -name "*.zip" -exec cp {} release_out/ \;
          ZIP_NAME=$(ls release_out | head -n 1)
          if [ -n "$ZIP_NAME" ]; then
            SHA256=$(sha256sum "release_out/$ZIP_NAME" | awk '{print $1}')
            echo "ZIP_PATH=release_out/$ZIP_NAME" >> $GITHUB_ENV
            echo "ZIP_SHA256=$SHA256" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        if: env.ZIP_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bangkk-${{ env.BUILD_ID }}
          name: SUSHI Kernel (bangkk) - ${{ env.BUILD_ID }}
          body: |
            * Device: bangkk
            * KernelSU: Yes
            * Date: ${{ env.DATE_STR }}
            * SHA256: `${{ env.ZIP_SHA256 }}`
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
