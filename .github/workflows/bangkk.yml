name: Build Sashimi Kernel bangkk

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel Branch'
        required: true
        default: 'resukisu'
        type: string
      upload_telegram:
        description: 'Upload build to Telegram'
        required: true
        default: true
        type: boolean
      create_release:
        description: 'Create GitHub Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Setup Dependencies & ID
        run: |
         sudo apt-get update
         sudo apt-get -y --no-install-recommends install libarchive-tools
          
          BUILD_ID=$(date +'%H%M')
          DATE_STR="$(date +'%d.%m.%y')'"
          DATE_TAG=$(date +'%Y%m%d')
          
          echo "BUILD_ID=${BUILD_ID}" >> $GITHUB_ENV
          echo "DATE_STR=${DATE_STR}" >> $GITHUB_ENV
          echo "DATE_TAG=${DATE_TAG}" >> $GITHUB_ENV

      - name: Clone Repo Kernel
        uses: sushikernel/github-repo-action@v3.1
        with:
          depth: 1
          branch: ${{ inputs.branch || 'resukisu' }}
          owner: 'MrEliteBall'
          repository: 'android_kernel_motorola_bangkk'

      - name: Clone Repo Build
        uses: sushikernel/github-repo-action@v3.1
        with:
          depth: 1
          branch: 'main'
          owner: 'SushiKernel'
          repository: 'build'

      - name: Prepare Configuration
        working-directory: ./Sashimi_Kernel-CI
        run: |
          CONFIG_ENV=$(cat config.env | grep -w "CONFIG_ENV" | head -n 1 | cut -d "=" -f 2)
          echo "ENABLE_CCACHE=$(cat $CONFIG_ENV | grep -w "ENABLE_CCACHE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV

      - name: Set swap to 24G
        uses: SushiKernel/swap@moe
        with:
          swap-size-gb: 10

      - name: Clone Repo Scripts
        uses: sushikernel/github-repo-action@v3.1
        with:
          owner: 'MrEliteBall'
          branch: 'bangkk'
          repository: 'scripts'

      - name: Move Scripts
        working-directory: ./scripts
        run: |
          chmod +x *.sh
          cp sashimi.sh bot.sh ../android_kernel_motorola_bangkk

      - name: Export Variables
        if: ${{ inputs.upload_telegram }}
        working-directory: ./android_kernel_motorola_bangkk
        run: |
          echo "CHAT_ID=${{ secrets.CHAT_ID }}" >> .env
          echo "MESSAGE_THREAD_ID=${{ secrets.MESSAGE_THREAD_ID }}" >> .env
          echo "API_ID=${{ secrets.API_ID }}" >> .env
          echo "API_HASH=${{ secrets.API_HASH }}" >> .env
          echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" >> .env
          echo "MY_ID=${{ secrets.MY_ID }}" >> .env
          echo "CHANNEL_ID=${{ secrets.CHANNEL_ID }}" >> .env

      - name: Compile Kernel CI
        working-directory: ./android_kernel_motorola_bangkk
        run: |
          if [ "${{ inputs.upload_telegram }}" = "true" ]; then
            ./bot.sh
          else
            ./sashimi.sh
          fi

      - name: Prepare Release Artifacts
        if: ${{ inputs.create_release }}
        run: |
          mkdir -p release_out
          ORIG_ZIP=$(find android_kernel_motorola_bangkk -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -n "$ORIG_ZIP" ]; then
            NEW_ZIP="sashimi-${{ env.DATE_TAG }}-${{ env.BUILD_ID }}-bangkk.zip"
            cp "$ORIG_ZIP" "release_out/$NEW_ZIP"
            SHA256=$(sha256sum "release_out/$NEW_ZIP" | awk '{print $1}')
            echo "ZIP_PATH=release_out/$NEW_ZIP" >> $GITHUB_ENV
            echo "ZIP_SHA256=$SHA256" >> $GITHUB_ENV
          fi

          curl -sLo "release_out/ReSukiSU_Manager.apk" "https://github.com/ReSukiSU/ReSukiSU/releases/download/v4.2.0-rc1/ReSukiSU_v4.2.0-rc1_35061-arm64-v8a-release.apk"

      - name: Create GitHub Release
        if: ${{ inputs.create_release && env.ZIP_PATH != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bangkk-${{ env.DATE_TAG }}-${{ env.BUILD_ID }}
          name: Sashimi Kernel (bangkk) - ${{ env.BUILD_ID }}
          body: |
            * Device: bangkk
            * Branch: ${{ inputs.branch || 'resukisu' }}
            * KernelSU: Yes ([ReSukiSU](https://github.com/${{ github.repository }}/releases/download/bangkk-${{ env.DATE_TAG }}-${{ env.BUILD_ID }}/ReSukiSU_Manager.apk))
            * Date: ${{ env.DATE_STR }}
            * SHA256: `${{ env.ZIP_SHA256 }}`
          files: |
            ${{ env.ZIP_PATH }}
            release_out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
